name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore project
      run: dotnet restore --source . --source https://api.nuget.org/v3/index.json

    - name: Build project
      run: dotnet publish XboxKit.csproj --configuration Release -f net10.0 -r win-x64 --no-self-contained -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false

    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: xboxkit
        path: /home/runner/work/XboxKit/XboxKit/bin/Release/net10.0/win-x64/publish/
