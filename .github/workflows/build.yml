name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build project
      run: dotnet publish XboxKit.csproj --configuration Release -f net8.0 -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: xboxkit
        path: /home/runner/work/XboxKit/XboxKit/bin/Release/net8.0/win-x64/publish/
