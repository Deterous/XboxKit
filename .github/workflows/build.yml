name: Build

on:
  push:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-x86
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore project
      run: dotnet restore XboxKit/XboxKit.csproj

    - name: Build project
      run: dotnet publish XboxKit/XboxKit.csproj --configuration Release -f net10.0 -r ${{ matrix.rid }} --no-self-contained -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols= -p:IncludeNativeLibrariesForSelfExtract=true

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: xboxkit-${{ matrix.rid }}
        path: XboxKit/bin/Release/net10.0/${{ matrix.rid }}/publish/
